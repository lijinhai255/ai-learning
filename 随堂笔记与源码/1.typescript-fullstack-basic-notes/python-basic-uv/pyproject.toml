[project]
name = "python-basic-uv"
version = "0.1.0"
description = "面向 TypeScript 学习者的 Python 基础与进阶示例工程"
readme = "README.md"
requires-python = ">=3.13"
dependencies = []

[project.scripts]
python-basic = "python_basic.main:main"

[dependency-groups]
dev = [
    "mypy>=1.13",
    "pytest>=8.0",
    "ruff>=0.9",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.13"
check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
